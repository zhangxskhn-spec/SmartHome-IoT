<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>设备管理 - SmartHome IoT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .view-toggle { display: flex; gap: 4px; background: var(--bg-hover); padding: 3px; border-radius: 8px; }
        .view-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: transparent; color: var(--text-secondary); transition: var(--transition); }
        .view-btn.active { background: white; color: var(--text-primary); box-shadow: var(--shadow-sm); }
        .room-section { margin-bottom: 24px; }
        .room-section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .room-section-title i { color: var(--primary); }
        .room-device-count { font-size: 12px; color: var(--text-muted); font-weight: 400; }
        .device-list-view .data-table td:first-child { font-weight: 600; }
        .device-actions-cell { display: flex; gap: 6px; }
        .search-box { position: relative; flex: 1; max-width: 300px; }
        .search-box input { width: 100%; padding: 8px 14px 8px 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); transition: var(--transition); }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .stat-mini { display: flex; gap: 16px; font-size: 13px; color: var(--text-muted); }
        .stat-mini span { display: flex; align-items: center; gap: 4px; }
        .stat-mini strong { color: var(--text-primary); font-weight: 600; }
        
        /* 手机适配 */
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .toolbar-left {
                flex-direction: column;
                gap: 8px;
            }
            .search-box {
                max-width: 100%;
            }
            .search-box input {
                padding: 10px 14px 10px 36px;
                font-size: 14px;
            }
            .filter-bar {
                overflow-x: auto;
                flex-wrap: nowrap;
                gap: 6px;
                padding-bottom: 4px;
                -webkit-overflow-scrolling: touch;
            }
            .filter-chip {
                white-space: nowrap;
                flex-shrink: 0;
                padding: 8px 14px;
                font-size: 13px;
                min-height: 38px;
            }
            .stat-mini {
                flex-wrap: wrap;
                gap: 10px;
                font-size: 12px;
            }
            .device-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .device-item {
                padding: 12px;
            }
            .device-icon {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .device-name {
                font-size: 13px;
            }
            .device-meta {
                font-size: 11px;
            }
            .room-section-title {
                font-size: 14px;
                margin-bottom: 8px;
            }
            .room-device-count {
                font-size: 11px;
            }
            .btn {
                min-height: 44px;
            }
            .btn-icon {
                min-width: 40px;
                min-height: 40px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="page-container">
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="搜索设备名称或型号..." id="searchInput" oninput="filterDevices()">
                </div>
                <div class="filter-bar" style="margin:0;">
                    <div class="filter-chip active" onclick="filterType(null, this)">全部</div>
                    <div class="filter-chip" onclick="filterType('sensor', this)">传感器</div>
                    <div class="filter-chip" onclick="filterType('light', this)">灯具</div>
                    <div class="filter-chip" onclick="filterType('fan', this)">风扇</div>
                    <div class="filter-chip" onclick="filterType('switch', this)">开关</div>
                    <div class="filter-chip" onclick="filterType('camera', this)">摄像头</div>
                    <div class="filter-chip" onclick="filterType('lock', this)">门锁</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="view-toggle">
                    <button class="view-btn active" onclick="setView('card', this)" title="卡片视图"><i class="bi bi-grid-3x3-gap"></i></button>
                    <button class="view-btn" onclick="setView('list', this)" title="列表视图"><i class="bi bi-list-ul"></i></button>
                </div>
                <button class="btn btn-primary" onclick="openAddModal()"><i class="bi bi-plus-lg"></i> 添加设备</button>
            </div>
        </div>

        <!-- 统计迷你条 -->
        <div class="stat-mini" id="statMini"></div>

        <!-- 设备内容区 -->
        <div id="deviceContent" style="margin-top:16px;">
            <div class="empty-state"><i class="bi bi-inbox"></i><p>加载中...</p></div>
        </div>
    </div>

    <!-- 添加/编辑模态框 -->
    <div class="modal-overlay" id="deviceModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">添加设备</div>
                <button class="modal-close" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="deviceId">
                <div class="form-group">
                    <label class="form-label">设备名称 *</label>
                    <input type="text" class="form-input" id="deviceName" placeholder="如: 客厅温湿度传感器">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div class="form-group">
                        <label class="form-label">设备类型 *</label>
                        <select class="form-select" id="deviceType">
                            <option value="sensor">传感器</option>
                            <option value="light">灯具</option>
                            <option value="fan">风扇</option>
                            <option value="switch">开关</option>
                            <option value="camera">摄像头</option>
                            <option value="lock">门锁</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">所属房间</label>
                        <select class="form-select" id="deviceRoom"></select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">设备型号</label>
                    <input type="text" class="form-input" id="deviceModel" placeholder="如: DHT22-Pro">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div class="form-group">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="deviceStatus">
                            <option value="1">在线</option>
                            <option value="0">离线</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">开关</label>
                        <select class="form-select" id="deviceSwitch">
                            <option value="0">关</option>
                            <option value="1">开</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveDevice()">保存</button>
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script>
        document.getElementById('app').innerHTML = renderNav('management');
        startClock();

        let allDevices = [], allRooms = [], currentType = null, currentView = 'card', searchQuery = '';

        async function loadData() {
            const [devRes, roomRes] = await Promise.all([apiGet('/devices'), apiGet('/rooms')]);
            if (devRes.data) allDevices = devRes.data;
            if (roomRes.data) allRooms = roomRes.data;
            renderRoomOptions();
            renderContent();
            renderStatMini();
        }

        function renderStatMini() {
            const total = allDevices.length;
            const online = allDevices.filter(d => d.status === 1).length;
            const active = allDevices.filter(d => d.switchState === 1).length;
            document.getElementById('statMini').innerHTML = `
                <span>共 <strong>${total}</strong> 台设备</span>
                <span><span class="device-status-dot online" style="display:inline-block;"></span> 在线 <strong>${online}</strong></span>
                <span><span class="device-status-dot offline" style="display:inline-block;"></span> 离线 <strong>${total - online}</strong></span>
                <span>运行中 <strong>${active}</strong></span>`;
        }

        function renderRoomOptions() {
            const sel = document.getElementById('deviceRoom');
            sel.innerHTML = `<option value="">未分配</option>` + allRooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
        }

        function filterType(type, el) {
            currentType = type;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderContent();
        }

        function filterDevices() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderContent();
        }

        function setView(view, el) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderContent();
        }

        function getFiltered() {
            return allDevices.filter(d => {
                if (currentType && d.type !== currentType) return false;
                if (searchQuery && !d.name.toLowerCase().includes(searchQuery) && !(d.model || '').toLowerCase().includes(searchQuery)) return false;
                return true;
            });
        }

        function renderContent() {
            const filtered = getFiltered();
            const container = document.getElementById('deviceContent');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="bi bi-search"></i><p>没有匹配的设备</p></div>`;
                return;
            }
            if (currentView === 'card') renderCardView(filtered, container);
            else renderListView(filtered, container);
        }

        function renderCardView(devices, container) {
            // 按房间分组
            const grouped = {};
            devices.forEach(d => {
                const room = d.roomName || '未分配';
                if (!grouped[room]) grouped[room] = [];
                grouped[room].push(d);
            });
            container.innerHTML = Object.entries(grouped).map(([room, devs]) => `
                <div class="room-section">
                    <div class="room-section-title"><i class="bi bi-house-door"></i> ${room} <span class="room-device-count">(${devs.length}台)</span></div>
                    <div class="device-grid">
                        ${devs.map(d => `
                            <div class="device-item animate-in">
                                <div class="device-item-header">
                                    <div style="display:flex;align-items:center;gap:10px;">
                                        <div class="device-icon ${d.type}"><i class="bi ${getDeviceIcon(d.type)}"></i></div>
                                        <div>
                                            <div class="device-name">${d.name}</div>
                                            <div class="device-meta">${getDeviceTypeLabel(d.type)} · ${d.model || '未知型号'}</div>
                                        </div>
                                    </div>
                                    <span class="tag ${d.status === 1 ? 'tag-online' : 'tag-offline'}">${d.status === 1 ? '在线' : '离线'}</span>
                                </div>
                                <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border-light);">
                                    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);">
                                        <i class="bi bi-battery-half"></i> ${d.battery || '--'}%
                                        <i class="bi bi-wifi" style="margin-left:8px;"></i> ${d.signalStrength || '--'}
                                    </div>
                                    <div class="device-actions-cell">
                                        <button class="btn-icon" onclick="editDevice(${d.id})" title="编辑"><i class="bi bi-pencil"></i></button>
                                        <button class="btn-icon" onclick="deleteDevice(${d.id}, '${d.name}')" title="删除" style="color:var(--danger);"><i class="bi bi-trash3"></i></button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderListView(devices, container) {
            container.innerHTML = `<div class="card"><div class="table-wrap"><table class="data-table">
                <thead><tr><th>设备名称</th><th>类型</th><th>房间</th><th>型号</th><th>状态</th><th>电量</th><th>信号</th><th>操作</th></tr></thead>
                <tbody>${devices.map(d => {
                    const rawBattery = parseInt(d.battery);
                    const battery = Number.isFinite(rawBattery) ? Math.min(100, Math.max(0, rawBattery)) : 0;
                    const batteryText = Number.isFinite(rawBattery) ? `${battery}%` : '--';
                    return `<tr>
                    <td><div class="table-cell-main"><div class="device-icon ${d.type}" style="width:34px;height:34px;font-size:14px;"><i class="bi ${getDeviceIcon(d.type)}"></i></div><div><div class="table-title">${d.name}</div><div class="table-subtitle">ID ${d.id} · ${d.model || '未知型号'}</div></div></div></td>
                    <td><span class="tag tag-info">${getDeviceTypeLabel(d.type)}</span></td>
                    <td>${d.roomName || '未分配'}</td>
                    <td style="color:var(--text-muted);">${d.model || '--'}</td>
                    <td><span class="tag ${d.status === 1 ? 'tag-online' : 'tag-offline'}">${d.status === 1 ? '在线' : '离线'}</span></td>
                    <td><span class="battery-cell"><span class="battery-meter ${battery > 0 && battery < 25 ? 'is-low' : ''}" style="--battery:${battery}%;"><span></span></span><span class="table-number">${batteryText}</span></span></td>
                    <td><span class="signal-pill"><i class="bi bi-wifi"></i>${d.signalStrength || '--'}</span></td>
                    <td><div class="device-actions-cell">
                        <button class="btn-icon" onclick="editDevice(${d.id})" title="编辑"><i class="bi bi-pencil"></i></button>
                        <button class="btn-icon" onclick="deleteDevice(${d.id}, '${d.name}')" title="删除" style="color:var(--danger);"><i class="bi bi-trash3"></i></button>
                    </div></td>
                </tr>`;
                }).join('')}</tbody>
            </table></div></div>`;
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = '添加设备';
            document.getElementById('deviceId').value = '';
            document.getElementById('deviceName').value = '';
            document.getElementById('deviceType').value = 'sensor';
            document.getElementById('deviceRoom').value = '';
            document.getElementById('deviceModel').value = '';
            document.getElementById('deviceStatus').value = '1';
            document.getElementById('deviceSwitch').value = '0';
            document.getElementById('deviceModal').classList.add('show');
        }

        function editDevice(id) {
            const d = allDevices.find(x => x.id === id);
            if (!d) return;
            document.getElementById('modalTitle').textContent = '编辑设备';
            document.getElementById('deviceId').value = d.id;
            document.getElementById('deviceName').value = d.name;
            document.getElementById('deviceType').value = d.type;
            document.getElementById('deviceRoom').value = d.roomId || '';
            document.getElementById('deviceModel').value = d.model || '';
            document.getElementById('deviceStatus').value = d.status;
            document.getElementById('deviceSwitch').value = d.switchState;
            document.getElementById('deviceModal').classList.add('show');
        }

        function closeModal() { document.getElementById('deviceModal').classList.remove('show'); }

        async function saveDevice() {
            const id = document.getElementById('deviceId').value;
            const data = {
                name: document.getElementById('deviceName').value,
                type: document.getElementById('deviceType').value,
                roomId: document.getElementById('deviceRoom').value || null,
                model: document.getElementById('deviceModel').value,
                status: parseInt(document.getElementById('deviceStatus').value),
                switchState: parseInt(document.getElementById('deviceSwitch').value)
            };
            if (!data.name) { showToast('请输入设备名称', 'error'); return; }
            let res;
            if (id) { res = await apiPut(`/devices/${id}`, data); }
            else { res = await apiPost('/devices', data); }
            if (res.code === 200) { showToast(id ? '更新成功' : '添加成功'); closeModal(); loadData(); }
            else { showToast(res.message || '操作失败', 'error'); }
        }

        async function deleteDevice(id, name) {
            if (!confirm(`确定删除设备「${name}」？`)) return;
            const res = await apiDelete(`/devices/${id}`);
            if (res.code === 200) { showToast('删除成功'); loadData(); }
            else { showToast('删除失败', 'error'); }
        }

        loadData();
    </script>
</body>
</html>
