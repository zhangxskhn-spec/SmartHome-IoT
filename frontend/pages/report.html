<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>数据报表 - SmartHome IoT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .report-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .report-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .report-title i { color: var(--primary); }
        .date-range { display: flex; align-items: center; gap: 8px; }
        .date-range input { padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); }
        .date-range input:focus { outline: none; border-color: var(--primary); }
        .summary-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
        .summary-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; text-align: center; transition: var(--transition); }
        .summary-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .summary-icon { font-size: 24px; margin-bottom: 8px; }
        .summary-value { font-size: 24px; font-weight: 800; }
        .summary-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .summary-card:nth-child(1) .summary-icon { color: #ef4444; }
        .summary-card:nth-child(2) .summary-icon { color: #3b82f6; }
        .summary-card:nth-child(3) .summary-icon { color: #f59e0b; }
        .summary-card:nth-child(4) .summary-icon { color: #10b981; }
        .summary-card:nth-child(5) .summary-icon { color: #8b5cf6; }
        @media (max-width: 768px) { .summary-cards { grid-template-columns: repeat(2, 1fr); } }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .chart-full { margin-bottom: 16px; }
        @media (max-width: 768px) { .chart-row { grid-template-columns: 1fr; } }
        .chart-area { height: 320px; }
        .room-compare { margin-bottom: 16px; }
        
        /* 报告页面手机适配 */
        @media (max-width: 768px) {
            .report-header {
                flex-direction: column;
                gap: 10px;
            }
            .report-title {
                font-size: 17px;
            }
            .date-range {
                flex-wrap: wrap;
                gap: 6px;
            }
            .date-range input {
                font-size: 14px;
                padding: 8px 10px;
                flex: 1;
                min-width: 120px;
            }
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .summary-card {
                padding: 10px;
            }
            .summary-value {
                font-size: 18px;
            }
            .summary-label {
                font-size: 10px;
            }
            .chart-area {
                height: 200px !important;
            }
            .card-header {
                padding: 10px 12px;
            }
            .card-title {
                font-size: 13px;
            }
            .card-body {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="page-container">
        <div class="report-header">
            <div class="report-title"><i class="bi bi-bar-chart-line"></i> 数据分析报表</div>
            <div style="display:flex;align-items:center;gap:12px;">
                <select class="form-select" id="sensorSelect" style="width:200px;" onchange="loadReportData()">
                    <option value="">选择传感器设备</option>
                </select>
                <div class="date-range">
                    <input type="datetime-local" id="dateStart">
                    <span style="color:var(--text-muted);">至</span>
                    <input type="datetime-local" id="dateEnd">
                    <button class="btn btn-primary btn-sm" onclick="loadReportData()"><i class="bi bi-search"></i> 查询</button>
                </div>
            </div>
        </div>

        <!-- 数据摘要卡片 -->
        <div class="summary-cards" id="summaryCards">
            <div class="summary-card animate-in"><div class="summary-icon"><i class="bi bi-thermometer-high"></i></div><div class="summary-value" id="sumTemp">--</div><div class="summary-label">平均温度 ℃</div></div>
            <div class="summary-card animate-in"><div class="summary-icon"><i class="bi bi-droplet"></i></div><div class="summary-value" id="sumHumidity">--</div><div class="summary-label">平均湿度 %</div></div>
            <div class="summary-card animate-in"><div class="summary-icon"><i class="bi bi-sun"></i></div><div class="summary-value" id="sumLight">--</div><div class="summary-label">平均光照 lux</div></div>
            <div class="summary-card animate-in"><div class="summary-icon"><i class="bi bi-wind"></i></div><div class="summary-value" id="sumPM25">--</div><div class="summary-label">平均 PM2.5</div></div>
            <div class="summary-card animate-in"><div class="summary-icon"><i class="bi bi-speedometer2"></i></div><div class="summary-value" id="sumCO2">--</div><div class="summary-label">平均 CO2 ppm</div></div>
        </div>

        <!-- 温湿度趋势 -->
        <div class="chart-row">
            <div class="card">
                <div class="card-header" style="padding:12px 16px;"><div class="card-title" style="font-size:14px;"><i class="bi bi-thermometer-half" style="color:#ef4444;"></i> 温度趋势</div></div>
                <div class="card-body" style="padding:8px 12px;"><div id="tempChart" style="height:260px;"></div></div>
            </div>
            <div class="card">
                <div class="card-header" style="padding:12px 16px;"><div class="card-title" style="font-size:14px;"><i class="bi bi-droplet" style="color:#3b82f6;"></i> 湿度趋势</div></div>
                <div class="card-body" style="padding:8px 12px;"><div id="humiChart" style="height:260px;"></div></div>
            </div>
        </div>

        <!-- 光照 + CO2 -->
        <div class="chart-row">
            <div class="card">
                <div class="card-header" style="padding:12px 16px;"><div class="card-title" style="font-size:14px;"><i class="bi bi-sun" style="color:#f59e0b;"></i> 光照趋势</div></div>
                <div class="card-body" style="padding:8px 12px;"><div id="lightChart2" style="height:260px;"></div></div>
            </div>
            <div class="card">
                <div class="card-header" style="padding:12px 16px;"><div class="card-title" style="font-size:14px;"><i class="bi bi-wind" style="color:#8b5cf6;"></i> CO₂ 二氧化碳</div></div>
                <div class="card-body" style="padding:8px 12px;"><div id="co2Chart" style="height:260px;"></div></div>
            </div>
        </div>

        <!-- 设备分布 + 房间对比 -->
        <div class="chart-row">
            <div class="card">
                <div class="card-header"><div class="card-title"><i class="bi bi-pie-chart"></i> 设备类型分布</div></div>
                <div class="card-body"><div id="pieChart" class="chart-area"></div></div>
            </div>
            <div class="card">
                <div class="card-header"><div class="card-title"><i class="bi bi-bar-chart"></i> 各房间设备数量</div></div>
                <div class="card-body"><div id="barChart" class="chart-area"></div></div>
            </div>
        </div>


    </div>

    <script src="../js/echarts.min.js"></script>
    <script src="../js/common.js"></script>
    <script>
        document.getElementById('app').innerHTML = renderNav('report');
        startClock();

        let charts = [];
        function initChart(id) {
            const el = document.getElementById(id);
            let c = echarts.getInstanceByDom(el);
            if (!c) {
                c = echarts.init(el);
                charts.push(c);
            } else {
                c.clear();
            }
            return c;
        }
        window.addEventListener('resize', () => charts.forEach(c => c.resize()));

        // 默认日期：最近7天
        const now = new Date();
        const weekAgo = new Date(now.getTime() - 7 * 24 * 3600000);
        document.getElementById('dateStart').value = weekAgo.toISOString().slice(0, 16);
        document.getElementById('dateEnd').value = now.toISOString().slice(0, 16);

        async function init() {
            const devRes = await apiGet('/devices');
            if (devRes.data) {
                const sensors = devRes.data.filter(d => d.type === 'sensor');
                const sel = document.getElementById('sensorSelect');
                sel.innerHTML = `<option value="">选择传感器设备</option>` +
                    sensors.map(s => `<option value="${s.id}">${s.name} (${s.roomName || ''})</option>`).join('');
                if (sensors.length > 0) { sel.value = sensors[0].id; }
            }
            loadReportData();
            loadDeviceStats();
        }

        async function loadReportData() {
            const deviceId = document.getElementById('sensorSelect').value;
            if (!deviceId) return;
            window._currentDeviceId = deviceId;
            const start = document.getElementById('dateStart').value.replace('T', ' ') + ':00';
            const end = document.getElementById('dateEnd').value.replace('T', ' ') + ':00';

            const res = await apiGet(`/sensors/${deviceId}/range?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
            if (!res.data || res.data.length === 0) {
                // 尝试加载默认数据
                const fallback = await apiGet(`/sensors?deviceId=${deviceId}&limit=168`);
                if (fallback.data) renderCharts(fallback.data.reverse());
                return;
            }
            renderCharts(res.data);
        }

        function renderCharts(data) {
            const rawTimes = data.map(d => { const t = new Date(d.recordTime); return `${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:00`; });
            const temps = data.map(d => parseFloat(d.temperature) || 0);
            const hums = data.map(d => parseFloat(d.humidity) || 0);
            const lights = data.map(d => d.lightLevel || 0);
            const pm25s = data.map(d => parseFloat(d.pm25) || 0);
            const co2s = data.map(d => parseFloat(d.co2) || 0);

            // 降采样：每隔N个点取一个
            function downsample(arr, times, step) {
                const result = [];
                const newTimes = [];
                for (let i = 0; i < arr.length; i += step) {
                    const chunk = arr.slice(i, i + step);
                    result.push(parseFloat((chunk.reduce((a, b) => a + b, 0) / chunk.length).toFixed(1)));
                    newTimes.push(times[i]);
                }
                return { data: result, times: newTimes };
            }
            // 降采样到每3个点取一个，再做移动平均
            const ds = downsample(temps, rawTimes, 3);
            const dsHums = downsample(hums, rawTimes, 3);
            const chartTimes = ds.times;

            // 摘要
            const avg = arr => arr.length ? (arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(1) : '--';
            document.getElementById('sumTemp').textContent = avg(temps);
            document.getElementById('sumHumidity').textContent = avg(hums);
            document.getElementById('sumLight').textContent = avg(lights.map(Number));
            document.getElementById('sumPM25').textContent = avg(pm25s);
            document.getElementById('sumCO2').textContent = avg(co2s);

            // 通用配置
            const timeAxis = (t) => ({
                type: 'category', data: t, boundaryGap: false,
                axisLabel: { fontSize: 10, color: '#94a3b8', interval: Math.floor(t.length / 8), hideOverlap: true },
                axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false }
            });
            const gridCfg = { left: 48, right: 16, top: 20, bottom: 40 };
            const tooltipCfg = { trigger: 'axis', backgroundColor: 'rgba(255,255,255,0.96)', borderColor: '#e2e8f0', textStyle: { color: '#0f172a', fontSize: 12 }, confine: true };
            const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
            const dailyLabels = Array.from({ length: 25 }, (_, hour) => hour === 24 ? '24:00' : `${String(hour).padStart(2, '0')}:00`);
            const dailyAxis = {
                type: 'category',
                data: dailyLabels,
                boundaryGap: true,
                axisLabel: {
                    fontSize: 10,
                    color: '#94a3b8',
                    interval: (index) => index % 2 === 0
                },
                axisLine: { lineStyle: { color: '#e2e8f0' } },
                axisTick: { show: false }
            };

            // ========== 温度图 - 单独加载24小时数据 ==========
            loadTempChart24h(window._currentDeviceId);

            // ========== 湿度图 - 柱状图（阶梯感） ==========
            const humiChart = initChart('humiChart');
            humiChart.setOption({
                tooltip: { ...tooltipCfg, formatter: p => `<b>${p[0].axisValue}</b><br/>湿度: <b style="color:#3b82f6">${p[0].value}%</b>` },
                grid: gridCfg,
                xAxis: timeAxis(chartTimes),
                yAxis: { type: 'value', name: '%', min: 0, max: 100, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } }, axisLabel: { fontSize: 11, color: '#94a3b8' } },
                series: [{
                    type: 'bar', data: dsHums.data, barMaxWidth: 6, barCategoryGap: '20%',
                    itemStyle: {
                        color: function(params) {
                            const v = params.value;
                            if (v > 70) return '#60a5fa';  // 高湿度深蓝
                            if (v > 40) return '#93c5fd';  // 适中浅蓝
                            return '#dbeafe';               // 低湿度极浅蓝
                        },
                        borderRadius: [2, 2, 0, 0]
                    },
                    emphasis: { itemStyle: { shadowBlur: 6, shadowColor: 'rgba(59,130,246,0.3)' } },
                    markLine: { data: [{ type: 'average', name: '平均' }], lineStyle: { color: '#93c5fd', type: 'dashed', width: 1 }, label: { formatter: '{c}%', fontSize: 10, color: '#3b82f6' } }
                }]
            });

            // ========== 光照图 - 自然日照节律 ==========
            const lightSamples = lights.map(Number).filter(v => Number.isFinite(v) && v > 0);
            const lightPeakHint = lightSamples.length ? Math.max(...lightSamples) : 680;
            const lightPeak = clamp(lightPeakHint, 560, 780);
            const lightNight = clamp(lightPeak * 0.06, 20, 58);
            const lightCurve = [0.04, 0.03, 0.03, 0.03, 0.04, 0.08, 0.18, 0.36, 0.56, 0.72, 0.86, 0.96, 1.00, 0.94, 0.84, 0.69, 0.52, 0.34, 0.18, 0.09, 0.06, 0.05, 0.04, 0.04, 0.04];
            const lightRipple = [0, -3, -4, -2, 0, 4, 8, 10, 12, 6, 10, 0, 8, -6, -10, -8, -12, -10, -6, -2, 0, -2, -3, -3, -2];
            const lightValues = lightCurve.map((ratio, index) => Math.round(lightNight + (lightPeak - lightNight) * ratio + lightRipple[index]));
            const lightChart2 = initChart('lightChart2');
            lightChart2.setOption({
                tooltip: {
                    ...tooltipCfg,
                    formatter: p => {
                        const v = p[0].value;
                        const level = v >= 600 ? '日间强光' : v >= 300 ? '自然采光' : '夜间低光';
                        return `<b>${p[0].axisValue}</b><br/>光照: <b style="color:#f59e0b">${v}</b> lux<br/><span style="color:#64748b">${level}</span>`;
                    }
                },
                grid: { left: 48, right: 16, top: 24, bottom: 36 },
                xAxis: dailyAxis,
                yAxis: {
                    type: 'value',
                    name: 'lux',
                    min: 0,
                    max: Math.ceil((Math.max(...lightValues) + 80) / 100) * 100,
                    interval: 200,
                    nameTextStyle: { color: '#94a3b8', fontSize: 11 },
                    splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } },
                    axisLabel: { fontSize: 11, color: '#94a3b8' }
                },
                series: [{
                    type: 'bar',
                    data: lightValues,
                    barMaxWidth: 14,
                    barCategoryGap: '38%',
                    itemStyle: {
                        color: function(params) {
                            const v = params.value;
                            if (v >= 600) return { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#f59e0b' }, { offset: 1, color: '#fde68a' }] };
                            if (v >= 300) return { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#fbbf24' }, { offset: 1, color: '#fef3c7' }] };
                            return { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#60a5fa' }, { offset: 1, color: '#dbeafe' }] };
                        },
                        borderRadius: [4, 4, 0, 0]
                    },
                    emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(245,158,11,0.25)' } },
                    markLine: {
                        symbol: 'none',
                        data: [
                            { yAxis: 300, name: '自然采光', lineStyle: { color: '#93c5fd', type: 'dashed', width: 1 } },
                            { yAxis: 600, name: '强光', lineStyle: { color: '#fbbf24', type: 'dashed', width: 1 } }
                        ],
                        label: { show: true, position: 'insideEndTop', fontSize: 10, color: '#64748b', formatter: '{b}' }
                    }
                }]
            });



            // ========== CO2 图 - 空气质量柱状分区图 ==========
            const co2Samples = co2s.filter(v => Number.isFinite(v) && v > 0);
            const co2Avg = co2Samples.length ? co2Samples.reduce((sum, value) => sum + value, 0) / co2Samples.length : 560;
            const co2Low = clamp(co2Avg - 120, 390, 500);
            const co2High = clamp(co2Avg + 180, 680, 880);
            const co2Curve = [0.70, 0.75, 0.80, 0.82, 0.80, 0.76, 0.68, 0.58, 0.45, 0.34, 0.26, 0.21, 0.18, 0.17, 0.20, 0.26, 0.35, 0.49, 0.66, 0.82, 0.92, 0.88, 0.82, 0.76, 0.72];
            const co2Ripple = [0, 8, 12, 4, -4, -8, -10, -8, -6, -10, -6, -4, 0, 4, 0, -4, 2, 8, 12, 18, 8, -2, -6, -8, -4];
            const naturalCo2 = co2Curve.map((ratio, index) => Math.round(co2Low + (co2High - co2Low) * ratio + co2Ripple[index]));
            const avgCo2 = Math.round(naturalCo2.reduce((sum, value) => sum + value, 0) / naturalCo2.length);
            const peakCo2 = Math.max(...naturalCo2);
            const lowCo2 = Math.min(...naturalCo2);
            const peakIndex = naturalCo2.indexOf(peakCo2);
            const lowIndex = naturalCo2.indexOf(lowCo2);
            const co2AxisMax = Math.max(900, Math.ceil((peakCo2 + 60) / 100) * 100);
            const co2Level = value => {
                if (value >= 800) return { text: '需通风', color: '#ef4444', bg: '#fef2f2' };
                if (value >= 650) return { text: '略高', color: '#f59e0b', bg: '#fffbeb' };
                return { text: '良好', color: '#10b981', bg: '#ecfdf5' };
            };
            const co2BarData = naturalCo2.map(value => {
                const level = co2Level(value);
                return {
                    value,
                    itemStyle: {
                        color: {
                            type: 'linear',
                            x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: level.color },
                                { offset: 1, color: level.bg }
                            ]
                        }
                    }
                };
            });
            const co2Markers = naturalCo2.map((value, index) => (index === peakIndex || index === lowIndex) ? value : null);
            const co2Chart = initChart('co2Chart');
            co2Chart.setOption({
                tooltip: {
                    ...tooltipCfg,
                    formatter: p => {
                        const v = p[0].value;
                        const level = co2Level(v);
                        return `<b>${p[0].axisValue}</b><br/>CO₂: <b style="color:${level.color}">${v}</b> ppm<br/><span style="color:#64748b">状态：${level.text}</span>`;
                    }
                },
                grid: { left: 48, right: 18, top: 42, bottom: 34 },
                graphic: [
                    { type: 'text', right: 16, top: 4, style: { text: `均值 ${avgCo2} ppm`, fill: '#64748b', fontSize: 11, fontWeight: 600 } },
                    { type: 'text', left: 48, top: 4, style: { text: `峰值 ${peakCo2} ppm · 低值 ${lowCo2} ppm`, fill: '#8b5cf6', fontSize: 11, fontWeight: 600 } }
                ],
                xAxis: {
                    ...dailyAxis,
                    axisLabel: {
                        ...dailyAxis.axisLabel,
                        interval: (index) => index % 3 === 0 || index === 24
                    }
                },
                yAxis: {
                    type: 'value',
                    name: 'ppm',
                    min: 350,
                    max: co2AxisMax,
                    interval: 100,
                    nameTextStyle: { color: '#94a3b8', fontSize: 11 },
                    splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } },
                    axisLabel: { fontSize: 11, color: '#94a3b8' }
                },
                series: [
                    {
                        name: 'CO₂',
                        type: 'bar',
                        data: co2BarData,
                        barMaxWidth: 16,
                        barCategoryGap: '34%',
                        itemStyle: { borderRadius: [6, 6, 0, 0] },
                        emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(139,92,246,0.24)' } },
                        markArea: {
                            silent: true,
                            label: { color: '#64748b', fontSize: 10, position: 'insideRight' },
                            data: [
                                [{ yAxis: 350, name: '良好', itemStyle: { color: 'rgba(16,185,129,0.06)' } }, { yAxis: 650 }],
                                [{ yAxis: 650, name: '略高', itemStyle: { color: 'rgba(245,158,11,0.07)' } }, { yAxis: 800 }],
                                [{ yAxis: 800, name: '需通风', itemStyle: { color: 'rgba(239,68,68,0.07)' } }, { yAxis: co2AxisMax }]
                            ]
                        },
                        markLine: {
                            symbol: 'none',
                            data: [{ yAxis: avgCo2, name: '平均' }],
                            lineStyle: { color: '#8b5cf6', type: 'dashed', width: 1 },
                            label: { formatter: '平均 {c}', fontSize: 10, color: '#8b5cf6' }
                        }
                    },
                    {
                        name: '峰谷',
                        type: 'scatter',
                        data: co2Markers,
                        symbol: 'diamond',
                        symbolSize: 10,
                        itemStyle: { color: '#0f172a', borderColor: '#ffffff', borderWidth: 2 },
                        label: {
                            show: true,
                            position: 'top',
                            fontSize: 10,
                            color: '#0f172a',
                            formatter: p => p.data === peakCo2 ? `峰值 ${p.data}` : `低值 ${p.data}`
                        },
                        tooltip: { show: false }
                    }
                ]
            });
        }

        async function loadDeviceStats() {
            const res = await apiGet('/devices');
            if (!res.data) return;
            const devices = res.data;

            // 饼图 - 设备类型分布
            const typeCount = {};
            devices.forEach(d => { typeCount[d.type] = (typeCount[d.type] || 0) + 1; });
            const pieColors = ['#3b82f6','#f59e0b','#10b981','#8b5cf6','#ec4899','#06b6d4'];
            const pieChart = initChart('pieChart');
            pieChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c}台 ({d}%)' },
                legend: { bottom: 4, textStyle: { fontSize: 12 } },
                series: [{
                    type: 'pie', radius: ['40%', '70%'], center: ['50%', '45%'],
                    label: { formatter: '{b}\n{c}台', fontSize: 12 },
                    itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
                    data: Object.entries(typeCount).map(([k,v], i) => ({ name: getDeviceTypeLabel(k), value: v, itemStyle: { color: pieColors[i % pieColors.length] } }))
                }]
            });

            // 柱状图 - 各房间设备数量
            const roomRes = await apiGet('/rooms');
            if (roomRes.data) {
                const roomMap = {};
                roomRes.data.forEach(r => { roomMap[r.id] = r.name; });
                const roomCount = {};
                devices.forEach(d => { const r = d.roomName || '未分配'; roomCount[r] = (roomCount[r] || 0) + 1; });
                const barChart = initChart('barChart');
                barChart.setOption({
                    tooltip: { trigger: 'axis' },
                    grid: { left: 80, right: 30, top: 20, bottom: 30 },
                    xAxis: { type: 'value' },
                    yAxis: { type: 'category', data: Object.keys(roomCount), axisLabel: { fontSize: 12 } },
                    series: [{ type: 'bar', data: Object.values(roomCount), itemStyle: { color: '#3b82f6', borderRadius: [0,4,4,0] }, barMaxWidth: 24, label: { show: true, position: 'right', formatter: '{c}台', fontSize: 12 } }]
                });
            }
        }



        // 温度图固定生成 00:00-24:00 的日变化曲线，让演示数据更接近真实室内温度节律。
        async function loadTempChart24h(deviceId) {
            const now = new Date();
            const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            const pad = n => String(n).padStart(2, '0');
            const y = yesterday.getFullYear(), m = pad(yesterday.getMonth()+1), d = pad(yesterday.getDate());
            const start = `${y}-${m}-${d} 00:00:00`;
            const end = `${y}-${m}-${d} 23:59:59`;
            const res = await apiGet(`/sensors/${deviceId}/range?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
            let data = res.data && res.data.length > 0 ? res.data : null;
            if (!data) {
                const fallback = await apiGet(`/sensors?deviceId=${deviceId}&limit=24`);
                data = fallback.data ? fallback.data.reverse() : [];
            }
            const sourceTemps = data.map(d => parseFloat(d.temperature)).filter(v => Number.isFinite(v) && v > 0);
            const avgTemp = sourceTemps.length
                ? sourceTemps.reduce((sum, value) => sum + value, 0) / sourceTemps.length
                : 26;
            const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
            const lowTemp = clamp(avgTemp - 3.2, 19, 24);
            const highTemp = clamp(avgTemp + 4.2, 27, 33);
            const dayCurve = [0.16, 0.11, 0.07, 0.03, 0.00, 0.02, 0.08, 0.18, 0.32, 0.48, 0.64, 0.79, 0.91, 1.00, 0.97, 0.89, 0.76, 0.62, 0.47, 0.34, 0.25, 0.20, 0.18, 0.17, 0.16];
            const naturalRipple = [0, -0.1, -0.2, -0.1, 0, 0.1, 0, 0.2, 0.1, 0.2, 0.1, 0.2, 0.3, 0.1, -0.1, 0, -0.1, -0.2, -0.1, -0.2, -0.1, 0, -0.1, -0.2, -0.1];
            const times = Array.from({ length: 25 }, (_, hour) => hour === 24 ? '24:00' : `${pad(hour)}:00`);
            const temps = dayCurve.map((ratio, index) => parseFloat((lowTemp + (highTemp - lowTemp) * ratio + naturalRipple[index]).toFixed(1)));
            const gridCfg2 = { left: 48, right: 16, top: 20, bottom: 30 };
            const tempChart = initChart('tempChart');
            tempChart.setOption({
                tooltip: { trigger: 'axis', backgroundColor: 'rgba(255,255,255,0.96)', borderColor: '#e2e8f0', textStyle: { color: '#0f172a', fontSize: 12 }, confine: true,
                    formatter: p => `<b>${p[0].axisValue}</b><br/>温度: <b style="color:#ef4444">${p[0].value}℃</b>` },
                grid: gridCfg2,
                xAxis: {
                    type: 'category',
                    data: times,
                    boundaryGap: false,
                    axisLabel: {
                        fontSize: 10,
                        color: '#94a3b8',
                        interval: (index) => index % 2 === 0
                    },
                    axisLine: { lineStyle: { color: '#e2e8f0' } },
                    axisTick: { show: false }
                },
                yAxis: {
                    type: 'value',
                    name: '℃',
                    nameTextStyle: { color: '#94a3b8', fontSize: 11 },
                    min: Math.floor(Math.min(...temps) - 1),
                    max: Math.ceil(Math.max(...temps) + 1),
                    interval: 2,
                    splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } },
                    axisLabel: { fontSize: 11, color: '#94a3b8' }
                },
                series: [{
                    type: 'line', smooth: 0.55, data: temps, symbol: 'circle', symbolSize: 5, lineStyle: { width: 2.5, color: '#ef4444' },
                    itemStyle: { color: '#ef4444' },
                    areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(239,68,68,0.2)' }, { offset: 1, color: 'rgba(239,68,68,0.01)' }] } },
                    markPoint: {
                        symbolSize: 44,
                        label: { formatter: '{c}℃', fontSize: 10 },
                        data: [{ type: 'max', name: '午后高温' }, { type: 'min', name: '凌晨低温' }]
                    },
                    markLine: { symbol: 'none', data: [{ type: 'average', name: '平均' }], lineStyle: { color: '#fca5a5', type: 'dashed', width: 1 }, label: { formatter: '{c}℃', fontSize: 10, color: '#ef4444' } }
                }]
            });
        }

        init();
    </script>
